name: CI

# Read-only build/test/lint gate. Touches no funds, no mainnet, no secrets.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  # Keep in sync with rust-toolchain.toml.
  RUST_TOOLCHAIN: '1.90.0'

jobs:
  build-canisters:
    name: Build canisters (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build all canisters (release wasm)
        run: cargo build --locked --release --target wasm32-unknown-unknown
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canister-wasms
          path: target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 1

  test:
    name: Cargo tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          # `poker_core`'s wasm32 golden replay is part of the default test run, so
          # this job needs the canister's target too. See the wasm32-tests job.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # `poker_core`'s wasm32 replay drives the module with Node, and its
      # cross-language check runs the Python verifier in
      # src/poker_core/tests/verify/ (python3 is preinstalled on ubuntu-latest).
      #
      # WHAT THIS COMMAND DOES NOT SEE. `tests/money_safety`, `tests/settlement`
      # and `tests/no_peeking` each carry a bare `[workspace]` table, which
      # DETACHES them from the root workspace on purpose: `pocket-ic` drags in
      # tokio + reqwest + rustls, and the root Cargo.lock is an input to the
      # reproducible build of six canisters that custody real ICP on mainnet.
      # `--workspace` therefore cannot reach a single fund-safety harness. That is
      # docs/DEFECTS.md H-23, and it is why the fund-safety-fast job below exists.
      - run: cargo test --locked --workspace

  suite-wiring:
    name: No test suite is run by nothing
    runs-on: ubuntu-latest
    # WHY THIS JOB EXISTS
    #
    # The same defect has been filed four times, under four numbers, and every
    # time it was found by a human reading a directory listing. It happened a
    # FIFTH time during the wave that wrote this job, and the script caught it in
    # a minute:
    #
    #   H-17  `deposit_replay` -- the only proven fund-theft reproducer in this
    #         project -- was cargo-auto-discovered and named by no target, for a
    #         whole wave.
    #   H-45  six money-safety suites, 46 tests, named by nothing. One of them,
    #         `fund_reachability`, was RED the entire time, and THE REGISTER CITED
    #         IT as what held M9 closed.
    #   H-50  `tools/archive` shipped with 39 self-tests and no runner, in a
    #         document whose own section opens "A gate nothing runs is worse than
    #         no gate".
    #   H-53  `tests/no_peeking` named all five of its targets explicitly in its
    #         own Cargo.toml *so that nothing would be auto-discovered* -- and
    #         then nothing named the Cargo.toml either.
    #
    # scripts/check-suite-wiring.sh is that directory-reading, mechanised: every
    # cargo test target in the repo must appear in scripts/test-suites.list, and
    # every row there must name a tier something actually runs. A suite added and
    # never wired now fails the build instead of sitting unrun.
    #
    # It also holds the tier assignment against the pressure that will be put on
    # it: the fast tier is the one that costs every pull request, so the incentive
    # is always to move things out of it. The gates that have actually convicted a
    # fund defect here -- the money invariants, the E-02 fund-theft reproducer,
    # the custody gate, the solvency gate and the settlement oracle -- are named in
    # the script's REQUIRED_FAST list and cannot be demoted to the nightly without
    # failing this job.
    #
    # No replica, no wasm, no network. Seconds.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: The check proves it can fail, before it is believed
        # It plants every failure it claims to catch -- an unwired new test file,
        # a whole new crate whose only tests are unit tests, a row whose file is
        # gone, a tier no workflow runs, the settlement oracle demoted out of the
        # required tier, and a tier name nothing recognises -- and requires itself
        # to go red on each, with a green baseline either side so the reds are not
        # vacuous. This repository has shipped a gate that could not fail (the
        # Candid drift job ended in `exit 0` behind a TODO while the committed
        # .did was missing seven fields and a whole method), so the proof runs
        # first, every time.
        run: ./scripts/check-suite-wiring.sh --selftest
      - name: Every test target in the tree is run by something
        run: ./scripts/check-suite-wiring.sh

  fund-safety-fast:
    name: Fund safety (fast tier, required)
    runs-on: ubuntu-latest
    # Sized for the COLD case, not the warm one. With rust-cache warm the tier is
    # roughly the sum of its suites; on the first run after a lockfile change it
    # also builds pocket-ic + tokio + rustls for two detached crates. A bound that
    # only fits the warm case turns a cache miss into a red required check, and a
    # required check that goes red for reasons unrelated to the code is a required
    # check somebody removes.
    timeout-minutes: 60
    # WHY THIS JOB EXISTS -- docs/DEFECTS.md H-23
    #
    # Until this job, EVERY fund-safety result in this project's documents came
    # from a harness no CI job invoked. The money invariants (M1..M14), the
    # settlement oracle, the hostile-sequence fuzzer, the custody gate and the
    # solvency gate ran on somebody's laptop, when they remembered. That is the
    # difference between a property that is enforced and a property that was once
    # observed, and this project has already watched a suite sit RED for a whole
    # wave while the register cited it as a gate.
    #
    # THE OBSTACLE WAS REAL, AND IT IS SOLVED RATHER THAN ROUTED AROUND. These
    # harnesses need a PocketIC server and a built canister wasm.
    # scripts/pocket-ic.sh fetches the exact server version tests/money_safety's
    # own Cargo.lock pins, verified against a recorded sha256;
    # scripts/ci-fund-safety.sh fetches the real ICP ledger module at the hash the
    # harness itself pins, and builds table_canister.wasm from this checkout.
    #
    # WHY IT IS SPLIT. `./scripts/dev.sh test` takes over twenty minutes on a fast
    # laptop. A required check that takes an hour gets marked non-required, and a
    # job nobody waits for gets skipped, so the split is honest rather than
    # cosmetic: this tier is everything that convicts a money defect in seconds
    # per suite, and fund-safety-deep.yml carries the runs whose value is DEPTH --
    # the fuzzer at 9 seeds x 600 messages, the 138-state stall sweep, the clock
    # tests that are slow because they WAIT, and the oracle's full random sweep.
    #
    # What is in each, and why, is one line per suite in scripts/test-suites.list.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # The fund-safety harnesses are DETACHED crates with their own
          # lockfiles and their own target dirs. Cache each, or every run pays to
          # rebuild pocket-ic + tokio + rustls from source and the "fast" tier is
          # not fast.
          workspaces: |
            . -> target
            tests/money_safety -> target
            tests/settlement -> target
      - name: Cache the pinned PocketIC server and ICP ledger module
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Deliberately OUTSIDE target/, so rust-cache's pruning and this cache
          # cannot fight over the same paths.
          path: ~/.cache/cleardeck
          # Keyed on the two files that DECIDE what gets fetched: the lockfile
          # (which pins the PocketIC server version) and wasms.rs (which pins the
          # ledger URL and its sha256). A cache hit therefore cannot serve the
          # wrong replica or the wrong ledger -- and both are hash-checked again
          # on use anyway, because a cache is not an authority.
          key: cleardeck-fixtures-${{ hashFiles('tests/money_safety/Cargo.lock', 'tests/money_safety/src/wasms.rs') }}
      - name: The fast fund-safety tier
        # $HOME is expanded by the shell here on purpose: an `env:` value of
        # `~/.cache/cleardeck` is passed through literally and would create a
        # directory called `~` in the workspace, which actions/cache would never
        # find.
        run: CLEARDECK_CACHE_DIR="$HOME/.cache/cleardeck" ./scripts/ci-fund-safety.sh fast

  wasm32-tests:
    name: Engine tests on wasm32 (the target that runs the money)
    runs-on: ubuntu-latest
    # WHY THIS JOB EXISTS
    #
    # `usize` is 32 bits on wasm32-unknown-unknown and 64 bits on every machine a
    # developer or CI runner tests on. The shipped shuffle reduced its 64-bit draw
    # with `(draw as usize) % (i + 1)`, so the canister dealt from a DIFFERENT deck
    # than the one every native test and every third-party reimplementation derived
    # from the same revealed seed. 101 green native tests said nothing about it, and
    # the "anyone can verify our shuffle" claim was false for the whole time it was
    # published. See docs/FINDING-02-shuffle-not-verifiable.md.
    #
    # RULE: any pure function whose result feeds the deal or the money is tested on
    # the target that actually runs it. This job replays the full golden fixture
    # (shuffle, hand evaluation, straight detection, side pots) inside a
    # wasm32-unknown-unknown module, and cross-checks it against two independent
    # verifiers written from docs/SHUFFLE-SPEC.md in Python and JavaScript.
    #
    # It needs no wasm runtime: the module is driven by Node's plain WebAssembly
    # API (wasm32-unknown-unknown has no WASI, so wasmtime could not run it).
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Replay the golden vectors inside a wasm32 module
        run: cargo test --locked -p poker_core --test wasm32_golden -- --nocapture
      - name: Sanity-check the wasm32 replay is not vacuous
        # A harness that silently checks nothing is the failure mode to fear, so
        # assert the module reports the full population from inside itself.
        run: |
          set -euo pipefail
          wasm=target/wasm32-shuffle-harness/wasm32-unknown-unknown/release/wasm32_shuffle_harness.wasm
          test -f "$wasm" || { echo "::error::wasm32 harness module was not built"; exit 1; }
          out=$(node src/poker_core/tests/wasm32_harness/run.mjs "$wasm" check)
          echo "$out"
          echo "$out" | grep -qx 'counts: S=2000 E=3000 F=3000 D=6188 P=1500'
      - name: Outsider verifiers reproduce the committed shuffle vectors
        run: |
          set -euo pipefail
          python3 src/poker_core/tests/verify/verify_shuffle.py \
            --vectors src/poker_core/tests/golden_vectors.txt | tee /tmp/py.txt
          node src/poker_core/tests/verify/verify_shuffle.mjs \
            --vectors src/poker_core/tests/golden_vectors.txt | tee /tmp/js.txt
          grep -qx 'checked 2000 shuffle vectors, 0 mismatched' /tmp/py.txt
          grep -qx 'checked 2000 shuffle vectors, 0 mismatched' /tmp/js.txt

  declarations-check:
    name: Declarations agree with what they describe
    runs-on: ubuntu-latest
    # Pure file-against-file comparison: no build, no network, seconds to run.
    # It exists because this repository has now been bitten four separate times
    # by a declaration that disagreed with the thing it declared. The full
    # inventory, and what does or does not guard each row, is in
    # docs/DECLARED-VS-STORED.md.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: ./scripts/check-declarations.sh

  candid-check:
    name: Candid interface drift
    runs-on: ubuntu-latest
    needs: build-canisters
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # Pinned on purpose: the extractor's output is an INPUT to this check, so
      # an unpinned `cargo install` lets an upstream release move the gate.
      - run: cargo install candid-extractor --version 0.1.6 --locked
      - name: The committed .did must describe the built wasm
        # THIS JOB USED TO BE DECORATION.
        #
        # It ran `diff -u committed.did extracted.did` and ended in `exit 0`
        # behind a TODO, so it passed while the committed table_canister.did was
        # missing seven fields and a whole method -- including
        # TableState.departed_stakes, the record that stops a departed player's
        # stake being reassigned to the deepest stack. The .did is not a comment:
        # recipes/rust-reproducible.hbs embeds it as the module's PUBLIC
        # candid:service metadata, so a stale one is a canister lying about
        # itself on-chain, and every generated client believes it.
        #
        # It could never be switched on because it compared the WRONG THING.
        # table_canister.did carries hundreds of lines of hand-written
        # documentation the extractor does not emit -- documentation that ships
        # on-chain in that same metadata -- and the extractor renumbers Result_N
        # aliases freely. A byte diff was so loud it had to be muted, and muted
        # it saw nothing. scripts/check-candid.sh compares fully-resolved method
        # signatures instead: immune to comments, ordering, alias names and blob
        # sugar, and unable to miss a dropped field or a missing method.
        #
        # The script self-tests before it judges: it asserts it does NOT flag two
        # identical-but-differently-written interfaces, and that it DOES catch a
        # dropped field, a widened integer, a vanished method, an extra method, a
        # demoted update call and a changed argument type. A gate that cannot go
        # red is worse than no gate, so this one proves it can, every run.
        run: ./scripts/check-candid.sh --declarations
      - name: The frontend's Candid BINDINGS must describe the canisters too
        # docs/DEFECTS.md D-11, THE THIRD COPY. The step above compares the Rust
        # against the committed `.did`, and `.did` against `src/declarations/<n>/<n>.did`.
        # Nothing compared `src/declarations/<n>/<n>.did.js`, which is the file
        # `src/cleardeck_frontend/src/lib/canisters.js` actually builds every actor
        # from. It had drifted from both: table_1's binding was missing SIXTEEN
        # methods (claim_external_deposit, get_solvency, refresh_solvency,
        # get_all_ledger_intents, get_deposit_replay_state ...) and declared TWO
        # the canister does not have. The custody and solvency instruments built
        # in waves 7-10 were unreachable from the UI, and nothing said so, because
        # the app guards its calls -- a missing binding reads as a missing feature.
        #
        # This regenerates the bindings from the committed `.did` with the same
        # candid_parser `didc bind` uses and diffs. It self-tests first, by
        # deleting a method from a binding and requiring a conviction.
        run: ./scripts/check-declarations-js.sh --selftest

  reproducible-build:
    name: Reproducible build (two paths, byte-identical)
    runs-on: ubuntu-latest
    # WHY THIS JOB EXISTS
    #
    # An independent auditor could not match the deployed module hash to ANY
    # commit in this repository, and found that the SAME SOURCE built at two
    # different directories produced two different module hashes. The cause was
    # a ~274 KB wasm `name` section that survived the shrink step carrying LLVM
    # disambiguators derived from the absolute build path. For an application
    # whose entire pitch is verifiable code, that is disqualifying on its own:
    # if the build is not reproducible, "compare the hash yourself" is theatre.
    #
    # This job is the guard. It builds every canister twice, at two deliberately
    # different absolute paths, and fails if a single byte differs. It runs the
    # real recipes/rust-reproducible.hbs through the real `icp build`, not a
    # re-implementation, so it also catches a change to the recipe that quietly
    # reintroduces path dependence.
    #
    # It does NOT use Docker: the point here is to test the build itself, fast,
    # on every PR. The docker-verification job below tests the image a stranger
    # actually runs.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the pinned build tools
        run: |
          set -euo pipefail
          # libdbus is a runtime dependency of the icp-cli binary.
          sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-3
          cargo install ic-wasm --version "$IC_WASM_VERSION" --locked
          npm i -g --no-fund --no-audit "@icp-sdk/icp-cli@$ICP_CLI_VERSION"
          icp --version && ic-wasm --version && cargo --version
        env:
          IC_WASM_VERSION: '0.9.9'
          ICP_CLI_VERSION: '1.0.2'
      - name: Build the same source at two different absolute paths
        run: |
          set -euo pipefail
          # The revision must be identical in both builds: it is embedded as
          # git:revision metadata, so it is part of the bytes being compared.
          export CLEARDECK_GIT_REVISION="${GITHUB_SHA}"
          export CLEARDECK_GIT_DIRTY=clean

          A="${RUNNER_TEMP}/p1"
          B="${RUNNER_TEMP}/a-deliberately-much-longer-absolute-path/for/the/very/same/source"
          mkdir -p "$A" "$B"
          for d in "$A" "$B"; do
            cp -R icp.yaml Cargo.toml Cargo.lock rust-toolchain.toml recipes "$d"/
            mkdir -p "$d/src"
            cp -R src/poker_core src/table_canister src/lobby_canister src/history_canister "$d/src"/
          done
          for d in "$A" "$B"; do (cd "$d" && icp build lobby history table_1 table_2 table_3 btc_table_1); done

          fail=0
          compared=0
          for n in btc_table_1 history lobby table_1 table_2 table_3; do
            # An artifact that is missing or trivially small means the build
            # quietly produced nothing and every hash below would agree on it.
            for f in "$A/.icp/cache/artifacts/$n" "$B/.icp/cache/artifacts/$n"; do
              test -s "$f" || { echo "::error::$f is missing or empty"; exit 1; }
              sz=$(wc -c < "$f")
              [ "$sz" -gt 100000 ] || { echo "::error::$f is only $sz bytes, that is not a canister"; exit 1; }
            done
            ha=$(sha256sum "$A/.icp/cache/artifacts/$n" | cut -d' ' -f1)
            hb=$(sha256sum "$B/.icp/cache/artifacts/$n" | cut -d' ' -f1)
            compared=$((compared + 1))
            if [ "$ha" = "$hb" ]; then
              printf 'ok        %-14s %s\n' "$n" "$ha"
            else
              printf '::error::%s is not reproducible: %s at %s, %s at %s\n' "$n" "$ha" "$A" "$hb" "$B"
              fail=1
            fi
          done
          [ "$compared" -eq 6 ] || { echo "::error::compared $compared canisters, expected 6"; exit 1; }
          exit $fail
      - name: Prove the guard is not vacuous
        # A reproducibility check that silently compares nothing is the failure
        # mode to fear, and this project has been bitten by exactly that before.
        # Two ways this guard could be blind, both checked here:
        #   1. A and B are secretly the same directory, so every comparison is
        #      a file against itself. Appending to B would then change A too and
        #      the hashes would still match, which this step reports as failure.
        #   2. sha256sum output is being mangled so every hash is the empty
        #      string and everything "matches".
        run: |
          set -euo pipefail
          A="${RUNNER_TEMP}/p1/.icp/cache/artifacts/table_2"
          B="${RUNNER_TEMP}/a-deliberately-much-longer-absolute-path/for/the/very/same/source/.icp/cache/artifacts/table_2"
          test -f "$A" && test -f "$B"
          ha=$(sha256sum "$A" | cut -d' ' -f1)
          [ "${#ha}" -eq 64 ] || { echo "::error::hash is '$ha', not 64 hex characters"; exit 1; }
          printf '\0' >> "$B"
          if [ "$ha" = "$(sha256sum "$B" | cut -d' ' -f1)" ]; then
            echo "::error::the two build directories are the same directory, or the comparison is broken"
            exit 1
          fi
          echo "ok: the comparison distinguishes two genuinely different files"

  docker-verification:
    name: The verification image a stranger actually runs
    runs-on: ubuntu-latest
    # WHY THIS JOB EXISTS
    #
    # The Dockerfile the README pointed a stranger at could not compile. Its
    # COPY list omitted the poker_core crate, its base image shipped the wrong
    # rustc, and the icp binary in it aborted on a missing libdbus-1.so.3.
    # Nobody noticed because nothing ever built it. Now something does, on
    # every PR, and the job fails if the image stops producing hashes.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build the verification image and read its hashes
        run: |
          set -euo pipefail
          docker build \
            --build-arg "GIT_REVISION=${GITHUB_SHA}" \
            --build-arg GIT_DIRTY=clean \
            -t cleardeck-verify .
          out=$(docker run --rm cleardeck-verify)
          echo "$out"
          # Six canisters, each with a 64-hex hash, or the image is not doing
          # its job however cleanly it exited.
          n=$(echo "$out" | grep -cE '^(lobby|history|table_1|table_2|table_3|btc_table_1)[[:space:]]+[0-9a-f]{64}$')
          [ "$n" -eq 6 ] || { echo "::error::expected 6 module hashes, got $n"; exit 1; }
          echo "$out" | grep -q "git:revision  ${GITHUB_SHA}" \
            || { echo "::error::the image did not stamp the revision it was told to build"; exit 1; }
      - name: The image must be byte-identical when built twice
        run: |
          set -euo pipefail
          first=$(docker run --rm cleardeck-verify)
          docker build --no-cache-filter=stage-1 \
            --build-arg "GIT_REVISION=${GITHUB_SHA}" \
            --build-arg GIT_DIRTY=clean \
            -t cleardeck-verify-again .
          second=$(docker run --rm cleardeck-verify-again)
          diff <(echo "$first" | grep -E '^[a-z_0-9]+ +[0-9a-f]{64}$') \
               <(echo "$second" | grep -E '^[a-z_0-9]+ +[0-9a-f]{64}$') \
            || { echo "::error::two builds of the same image produced different modules"; exit 1; }
          echo "ok: rebuilt from scratch, identical modules"

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      # THE NAMED MAINNET PATH, because the placeholder path stopped building.
      #
      # docs/DEFECTS.md E-95. This step used to be `npm run build` with
      # `DFX_NETWORK: ic` and `VITE_CANISTER_ID_* = aaaaa-aa`, under a comment
      # saying "the bundle resolves real IDs at deploy time from .env". That
      # stopped being true when the mainnet-id cross-check landed:
      # `vite.config.js` now ABORTS a `DFX_NETWORK=ic` build whose ids do not
      # match `.icp/data/mappings/ic.ids.json`, which placeholders never can. So
      # this job has failed on every run since, main's CI has been red
      # continuously, and a red pipeline is a pipeline nobody reads -- which is
      # what the fund-safety jobs above are about to be added to.
      #
      # `build:mainnet` is the one named path: it reads the ids from the TRACKED
      # mapping itself, refuses a contradictory ambient DFX_NETWORK (so this step
      # must NOT set one), verifies the bundle, and deletes dist if verification
      # fails.
      - name: Build frontend (the named mainnet path; declarations are committed under src/declarations)
        run: npm --workspace src/cleardeck_frontend run build:mainnet
