# yaml-language-server: $schema=https://github.com/dfinity/icp-cli/raw/refs/tags/v1.0.0/docs/schemas/icp-yaml-schema.json
#
# ClearDeck project manifest for @icp-sdk/icp-cli (target: 1.0.0 GA).
# Replaces dfx.json. Build/deploy with `icp`, not `dfx`.
#
# ⚠️  FUND-HOLDING CANISTERS: lobby, table_*, btc_table_1 and history hold real
#     ICP / ckBTC on mainnet. `icp deploy` defaults to `--mode auto`, which can
#     resolve to `install` on a canister it considers fresh. ALWAYS deploy the
#     backend with `--mode upgrade` (see scripts/deploy-mainnet.sh) and NEVER
#     `reinstall` — reinstall wipes stable state, including user balances.
#
# Recipe versions are pinned and independent of the CLI version. The asset
# recipe is on v2.2.1: icp-cli 1.0.2 removed the `assets` sync step type that
# v2.1.0 emitted, so v2.1.0 now fails to render at all (every `icp` command in
# this project errored, not just deploys).
#
# The Rust canisters do NOT use a registry recipe. They use the vendored
# recipes/rust-reproducible.hbs, a fork of @dfinity/rust@v3.2.0 that makes the
# module hash byte-reproducible and path-independent and that publishes the git
# revision as canister metadata. The build procedure is part of what a verifier
# checks, so it lives in this tree under the same review as the source: a
# registry tag can be re-pointed after the fact, a file at a commit cannot.
# Read recipes/rust-reproducible.hbs for the list of differences and why each
# one exists. Verify with `./scripts/verify-build.sh --local`.

# The default gateway port 8000 is regularly taken by another local icp-cli
# project on a shared dev machine, and `icp network start` refuses to share it.
# Pin our own port so bringing up the ClearDeck stack never requires stopping
# somebody else's replica.
networks:
  - name: local
    mode: managed
    gateway:
      port: 8077

canisters:
  # --- Table registry -------------------------------------------------------
  - name: lobby
    recipe:
      type: "file://recipes/rust-reproducible.hbs"
      configuration:
        package: lobby_canister
        candid: src/lobby_canister/lobby_canister.did
        shrink: true

  # --- Permanent hand history (provably-fair shuffle records) ---------------
  - name: history
    recipe:
      type: "file://recipes/rust-reproducible.hbs"
      configuration:
        package: history_canister
        candid: src/history_canister/history_canister.did
        shrink: true

  # --- Poker tables (one Rust package, distinct init args per instance) ------
  - name: table_1 # Heads-Up, 0.01/0.02 ICP
    recipe:
      type: "file://recipes/rust-reproducible.hbs"
      configuration:
        package: table_canister
        candid: src/table_canister/table_canister.did
        shrink: true
    init_args:
      value: '(record { small_blind = 1000000 : nat64; big_blind = 2000000 : nat64; min_buy_in = 200000000 : nat64; max_buy_in = 1000000000 : nat64; max_players = 2 : nat8; action_timeout_secs = 30 : nat64; ante = 0 : nat64; time_bank_secs = 30 : nat64; currency = variant { ICP } })'

  - name: table_2 # 6-max, 0.05/0.10 ICP
    recipe:
      type: "file://recipes/rust-reproducible.hbs"
      configuration:
        package: table_canister
        candid: src/table_canister/table_canister.did
        shrink: true
    init_args:
      value: '(record { small_blind = 5000000 : nat64; big_blind = 10000000 : nat64; min_buy_in = 1000000000 : nat64; max_buy_in = 5000000000 : nat64; max_players = 6 : nat8; action_timeout_secs = 45 : nat64; ante = 0 : nat64; time_bank_secs = 30 : nat64; currency = variant { ICP } })'

  - name: table_3 # 9-max, 0.10/0.20 ICP
    recipe:
      type: "file://recipes/rust-reproducible.hbs"
      configuration:
        package: table_canister
        candid: src/table_canister/table_canister.did
        shrink: true
    init_args:
      value: '(record { small_blind = 10000000 : nat64; big_blind = 20000000 : nat64; min_buy_in = 2000000000 : nat64; max_buy_in = 10000000000 : nat64; max_players = 9 : nat8; action_timeout_secs = 60 : nat64; ante = 0 : nat64; time_bank_secs = 30 : nat64; currency = variant { ICP } })'

  - name: btc_table_1 # Heads-Up, 100/200 sats (ckBTC)
    recipe:
      type: "file://recipes/rust-reproducible.hbs"
      configuration:
        package: table_canister
        candid: src/table_canister/table_canister.did
        shrink: true
    init_args:
      value: '(record { small_blind = 100 : nat64; big_blind = 200 : nat64; min_buy_in = 10000 : nat64; max_buy_in = 100000 : nat64; max_players = 2 : nat8; action_timeout_secs = 30 : nat64; ante = 0 : nat64; time_bank_secs = 30 : nat64; currency = variant { BTC } })'

  # --- THE GUARDIAN IS DELIBERATELY NOT HERE --------------------------------
  #
  # docs/SECURITY-FINDINGS.md FINDING 23 / docs/DEFECTS.md E-84. `src/guardian_canister`
  # is a controller-of-controllers: it holds the controller seat on the fund-holding
  # canisters and exposes only state-preserving, timelocked operations, so the key
  # that can zero a player's balance today could no longer do it at all. It is built
  # by `./scripts/build-guardian.sh` and gated by `./scripts/dev.sh custody`.
  #
  # It is absent from this file on purpose, for two reasons, and both are reversible
  # only by a deliberate decision:
  #
  # 1. REPRODUCIBILITY. `recipes/rust-reproducible.hbs` runs `cargo build --package
  #    <p> --locked` at the repo root, so a canister listed here must be a root
  #    workspace member — which rewrites the root Cargo.lock, an input to the build
  #    that mainnet's six backend modules currently match 6 of 6. The guardian
  #    carries its own `[workspace]` and its own lockfile so that cannot happen, and
  #    the cost of that choice is exactly this: `icp build` cannot see it.
  # 2. DECLARED VS DEPLOYED. A seventh backend canister here would make
  #    `scripts/check-deployed-config.sh` and `scripts/check-deployed.sh` report a
  #    fleet that does not match the manifest, on a LIVE system, before anything is
  #    deployed — a false red on the two gates whose whole job is to be believed.
  #
  # Deploying it is therefore a deliberate two-step (build here, then
  # `icp canister create` + `icp canister install --mode install` the artifact),
  # followed by the irreversible handover described in
  # docs/SECURITY-FINDINGS.md FINDING 23 §6. Adding it to this file is the LAST
  # step of that operation, not the first.

  # --- SvelteKit frontend (asset canister; `npm run build` -> dist) ----------
  - name: frontend
    recipe:
      type: "@dfinity/asset-canister@v2.2.1"
      configuration:
        dir: src/cleardeck_frontend/dist

# Internet Identity is not a project canister: on mainnet the frontend points
# at https://id.ai directly; for local dev `ii: true` deploys a local II.
environments:
  - name: local
    network: local
    ii: true
  - name: ic
    network: ic
