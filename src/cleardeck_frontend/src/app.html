<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
	<!--
		`initial-scale=1` is not cosmetic. Without it, Chrome on a phone widens the
		LAYOUT viewport until the widest element on the page fits and then paints the
		whole document scaled down to the screen: measured on a 390x844 device this
		build laid out at 425 CSS px and painted at 0.918, so every glyph was 8.2%
		smaller than the stylesheet says and ~32 device px of the right edge was
		blank background (docs/DEFECTS.md T-19).

		Pinning the scale only works while nothing forces the document past the
		device width -- otherwise the overflow is clipped instead of shrunk. The
		element that did force it was `.header-right` at 411.8 CSS px on the table
		view; `routes/+page.svelte` now lays that header out in two short rows in
		portrait, and the screenshot probe asserts `documentElement.scrollWidth ==
		390` so a future overflow is a measured failure and not a silent 0.9 zoom.

		No `maximum-scale` and no `user-scalable=no`: pinch-zoom stays available.

		`viewport-fit=cover` lets the page extend under the iPhone's home
		indicator and notch, and turns on the `env(safe-area-inset-*)` values the
		action dock pads itself with (poker-table-dock.scss, portrait). Without it
		the insets are 0 and the Fold button sits in the gesture zone.
	-->
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="theme-color" content="#0b0d12" />
	<!-- Standalone mode on a phone home screen: no browser toolbar eating the
	     action row, portrait locked where the platform honours it. -->
	<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<meta name="apple-mobile-web-app-title" content="ClearDeck" />
	<title>ClearDeck - Provably Fair Poker</title>
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
