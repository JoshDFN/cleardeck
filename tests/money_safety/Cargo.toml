[package]
name = "money_safety"
version = "0.1.0"
edition = "2021"
publish = false
description = "ClearDeck money-safety harness: named fund invariants M1..M6, a hostile-sequence fuzzer, and minimal regression reproducers, executed against the REAL table canister wasm and the REAL ICP ledger wasm on PocketIC."

# Deliberately DETACHED from the root workspace.
#
# 1. `pocket-ic` drags in tokio + reqwest + rustls. Adding it as a dev-dependency
#    of `table_canister` would put that tree in the lockfile of a canister that
#    custodies real ICP/ckBTC on mainnet, and would slow every `cargo build` of
#    the fund-holding crates.
# 2. This crate is written by a different owner than src/table_canister/**, so it
#    must not need edits to the shared root Cargo.toml / Cargo.lock.
#
# It therefore carries its own lockfile and its own target dir. See README.md for
# how to run it (it is NOT picked up by `cargo test --workspace`).
[workspace]

[lib]
name = "money_safety"
path = "src/lib.rs"

[dependencies]
# The REAL pure engine the canister links, host-built. Used ONLY as an oracle: the
# seam tests re-evaluate each showdown hand from the cards the canister revealed and
# compare against the rank the canister recorded, which is what makes "the canister
# actually consulted evaluate_hand" a checkable claim rather than an assumption
# (docs/DEFECTS.md H-04, mutation 6). `HandRank` and `Card` are also the exact
# Candid types on the canister's wire, so there is no second mirror to drift.
poker_core = { path = "../../src/poker_core" }
settlement_oracle = { path = "../settlement", default-features = false }
pocket-ic = "11.0.0"
# Same version pocket-ic 11 depends on: the settings/snapshot types the fault-injection
# tests need to talk to the management canister directly.
ic-management-canister-types = "0.5.0"
candid = "0.10"
# THE COMMITTED INTERFACE, PARSED AND USED AS A DECODER.
#
# `src/table_canister/table_canister.did` is what `icp.yaml` installs and what
# every client is generated from, and this project already has a finding for it
# not describing the code it claims to (FINDING 03 / E-08). `ic_cdk 0.19`'s
# `export_candid!()` emits the interface at BUILD time via candid-extractor, not
# as a queryable method, so the canister cannot simply be asked. Instead
# `tests/solvency.rs` parses the committed file and decodes a REAL reply against
# it: a client generated from that file can decode what the canister actually
# sends, or the test fails.
candid_parser = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
crc32fast = "1.3"
hex = "0.4"

# `tests/invariants/main.rs` is picked up by cargo's own target auto-discovery as
# the test target named `invariants`, so `cargo test --test invariants` -- the exact
# command `scripts/dev.sh test` runs -- still names it. It is a DIRECTORY so the
# seam tests and the classifier tests are part of the gate instead of sitting in a
# target nobody invokes. Declaring it explicitly here as well would collide with the
# auto-discovered target, so it is deliberately absent.
[[test]]
name = "regressions"
path = "tests/regressions.rs"

[[test]]
name = "fuzz"
path = "tests/fuzz.rs"

# Named explicitly for the same reason `regressions` and `fuzz` are, and for the
# reason `deposit_replay` had to be named in scripts/dev.sh: a cargo-auto-discovered
# target is a target no human ever types. This one reads src/table_canister/src/lib.rs
# and the two money modals and fails when a limit the UI STATES stops matching the
# limit the canister ENFORCES (docs/DEFECTS.md T-26). It needs no replica and no
# wasm -- two file reads -- so it is in the fast gate.
[[test]]
name = "ui_limits"
path = "tests/ui_limits.rs"

# THE ADMIN CUSTODY SURFACE (docs/SECURITY-FINDINGS.md FINDING 07). Named
# explicitly for the reason `deposit_replay` had to be named in scripts/dev.sh: an
# auto-discovered target is a target no human ever types, and the largest fund-loss
# path in this project survived four waves partly because nothing ran at it. If
# this file is renamed, this line fails rather than the coverage silently going away.
[[test]]
name = "admin_custody"
path = "tests/admin_custody.rs"

# PocketIC instances are heavy (one replica per instance). Keep test binaries
# from fighting over CPU by default; see README.md.
[profile.test]
opt-level = 1

# THE LEDGER/ESCROW BOUNDARY UNDER FAULT (docs/SECURITY-FINDINGS.md FINDING 29).
# Named explicitly for the reason `admin_custody` is: an auto-discovered target is
# a target no human ever types, and this one is the only gate on the money path
# that survives a discarded post-await continuation. If the file is renamed, this
# line fails rather than the coverage silently going away.
[[test]]
name = "ledger_boundary"
path = "tests/ledger_boundary.rs"

# CAN THIS CANISTER PAY EVERYONE, AND CAN IT SAY SO (docs/SECURITY-FINDINGS.md
# FINDING 35, docs/DEFECTS.md E-70). Named explicitly for the reason
# `admin_custody` and `ledger_boundary` are: an auto-discovered target is a target
# no human ever types, and there is a REAL 2.00 ICP shortfall on mainnet table_1
# that not one surface of the canister could see or say. If this file is renamed,
# this line fails rather than the coverage silently going away.
#
# NOT YET IN `scripts/dev.sh test`, which names its targets one by one and is
# owned elsewhere. `cargo test --tests` runs it; the canonical gate does not until
# a line is added there.
[[test]]
name = "solvency"
path = "tests/solvency.rs"

# THE OLDEST OPEN CLUSTER IN THE REGISTER (docs/SECURITY-FINDINGS.md FINDING 02,
# 05, 08, 09, 17, 22). Named explicitly for the reason `admin_custody` and
# `solvency` are: an auto-discovered target is a target no human ever types, and
# these six entries sat in the register with stale headers for three waves because
# nothing ran at them as a group. If this file is renamed, this line fails rather
# than the coverage silently going away.
[[test]]
name = "oldest_cluster"
path = "tests/oldest_cluster.rs"

# THE ONE DEPOSIT ADDRESS (docs/SECURITY-FINDINGS.md FINDING 06, 11, 34, 39).
# Named explicitly for the reason `admin_custody` and `ledger_boundary` are: an
# auto-discovered target is a target no human ever types. This one is also the
# only target in the project that spends through the ICP ledger's LEGACY
# `transfer` endpoint -- the only door a 64-hex address can be paid through, and
# the door every other test assumed instead of executing.
[[test]]
name = "deposit_surface"
path = "tests/deposit_surface.rs"

# THE ACCOUNT CENSUS (docs/SECURITY-FINDINGS.md FINDING 28, 21, 11). It existed
# from wave 8 and was named by NOTHING -- not here, not in scripts/dev.sh -- so
# FINDING 11's only gate sat outside every target anyone runs. Both are wired now.
[[test]]
name = "deposit_subaccount_anchor"
path = "tests/deposit_subaccount_anchor.rs"

# THE CONTROLLER SEAT (docs/SECURITY-FINDINGS.md FINDING 23). Named explicitly for
# the reason `admin_custody` and `deposit_subaccount_anchor` are: an
# auto-discovered target is a target no human ever types, and this is the gate on
# the only `fund-theft` item in the register that no in-canister audit surface can
# reach -- `install_code --mode reinstall` and `uninstall_code` are calls to the
# MANAGEMENT canister, so `require_controller()` never sees them. It is also named
# by `scripts/dev.sh test` and by `scripts/dev.sh custody`.
[[test]]
name = "controller_custody"
path = "tests/controller_custody.rs"

# HOW LONG BEFORE A CANISTER STOPS HONOURING WITHDRAWALS (docs/DEFECTS.md E-55,
# docs/SECURITY-FINDINGS.md FINDING 24 and 26). Named explicitly for the reason
# `admin_custody` and `solvency` are: an auto-discovered target is a target no
# human ever types, and this one carries the only measurement in the tree of what
# a table costs to run UNDER LOAD -- the idle figure in `timers` is the number for
# a table nobody is using, and it is 11x too optimistic. It also holds the port of
# FINDING 24's probe, which that finding says belongs in the tree and which
# nothing had executed here. Named by `scripts/dev.sh test` in the same change.
[[test]]
name = "cycles_runway"
path = "tests/cycles_runway.rs"
